[package]
name = "rs-read-trimesh"
version = "2.1.1"
authors = ["Bourumir Wyngs"]
description = "A reader for loading 3D meshes from PLY, STL, DAE (Collada) and OBJ into Parry Trimesh."
homepage = "https://github.com/bourumir-wyngs/rs-read-trimesh"
repository = "https://github.com/bourumir-wyngs/rs-read-trimesh.git"
license = "MIT"
readme = "README.md"
keywords = ["PLY", "STL", "OBJ", "DAE", "GLTF"]
categories = ["filesystem", "parser-implementations"]
edition = "2024"

[dependencies]
ply-rs-bw = "4.0"
stl_io = ">= 0.6, <= 0.11"
tobj = "4.0"
dae-parser = "0.11.0"
quick-xml = "0.41"
gltf = { version = "1.4.1", optional = true }
urlencoding = { version = "2.1.3", optional = true }
cap-std = { version = "4.0.3", optional = true }

parry13 = { package = "parry3d", version = ">=0.9, <0.14", optional = true }
parry17 = { package = "parry3d", version = ">=0.14, <0.18", optional = true }
parry_19 = { package = "parry3d", version = ">=0.18, <0.26", optional = true }
parry_26 = { package = "parry3d", version = "0.26", optional = true }
parry_27 = { package = "parry3d", version = "0.27", optional = true }
parry_28 = { package = "parry3d", version = "0.28", optional = true }
parry_29 = { package = "parry3d", version = "0.29", optional = true }
parry_30 = { package = "parry3d", version = "0.30", optional = true }
parry_31 = { package = "parry3d", version = "0.31", optional = true }

[target.'cfg(unix)'.dependencies]
# Nonblocking opens keep FIFOs from stalling any loader.
libc = "0.2"

[features]
use-parry-9_13 = ["parry13"]
use-parry-14_17 = ["parry17"]
use-parry-18_19 = ["parry_19"]
use-parry-26 = ["parry_26"]
use-parry-27 = ["parry_27"]
use-parry-28 = ["parry_28"]
use-parry-29 = ["parry_29"]
use-parry-30 = ["parry_30"]
use-parry-31 = ["parry_31"]
gltf = ["dep:gltf", "dep:urlencoding", "dep:cap-std"]
default = ["parry_28", "gltf"]

# cargo test --features use-parry-18_19 --no-default-features

# dae-parser still requires minidom-14 0.17, whose released version uses
# vulnerable quick-xml 0.36. This local patch upgrades it to quick-xml 0.41.
[patch.crates-io]
minidom-14 = { path = "vendor/minidom-14" }
